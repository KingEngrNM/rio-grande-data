name: Daily Rio Grande Data Update

"on":
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pandas openpyxl plotly

      - name: Run data fetcher
        run: python rio_grande_usgs.py

      - name: Keep workflow active via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT=$(echo "Last run: $(date -u '+%Y-%m-%d %H:%M UTC')" | base64 -w 0)
          SHA=$(gh api /repos/KingEngrNM/rio-grande-data/contents/last_run.txt --jq .sha 2>/dev/null || echo "")
          if [ -z "$SHA" ]; then
            gh api --method PUT /repos/KingEngrNM/rio-grande-data/contents/last_run.txt \
              --field message="chore: update last_run timestamp [skip ci]" \
              --field content="$CONTENT" || echo "API update failed, continuing"
          else
            gh api --method PUT /repos/KingEngrNM/rio-grande-data/contents/last_run.txt \
              --field message="chore: update last_run timestamp [skip ci]" \
              --field content="$CONTENT" \
              --field sha="$SHA" || echo "API update failed, continuing"
          fi

      - name: Assemble site folder
        run: |
          mkdir -p site
          cp index.html site/
          cp RioGrande_WaterYear_Daily.xlsx site/
          cp RioGrande_30Day_15min.xlsx site/
          cp RioGrande_Dashboard.html site/
          cp RioGrande_Dashboard_15min.html site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
